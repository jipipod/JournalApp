<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Journal</title>
<style>
  :root{
    --paper:#F1EFE8;
    --paper-card:#FBFAF6;
    --ink:#232A3B;
    --ink-soft:#5B6472;
    --rule:#D8D3C6;
    --accent:#2F6F62;
    --accent-soft:#E4EEEA;
    --gold:#B08D57;
    --locked:#C7C2B4;
    --error:#B3453C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }

  #authScreen{
    position:fixed;inset:0;background:var(--paper);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .authbox{
    width:100%;max-width:340px;background:var(--paper-card);
    border:1px solid var(--rule);border-radius:14px;padding:26px 22px;
  }
  .authbox h1{ font-family:Georgia,serif;font-size:22px;margin:0 0 4px; }
  .authbox p.sub{ margin:0 0 18px;font-size:13px;color:var(--ink-soft); }
  .authbox label{
    display:block;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;margin:12px 0 4px;
  }
  .authbox input{
    width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;
    font-size:15px;background:#fff;color:var(--ink);
  }
  .authbox input:focus{outline:none;border-color:var(--accent);}
  .authbox button.primary{
    width:100%;margin-top:18px;padding:11px;border:none;border-radius:8px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  }
  .authbox button.primary:disabled{opacity:0.5;}
  .authbox .switchmode{ margin-top:14px;text-align:center;font-size:13px;color:var(--ink-soft); }
  .authbox .switchmode button{
    background:none;border:none;color:var(--accent);font-weight:600;
    cursor:pointer;font-size:13px;padding:0;
  }
  .authmsg{ margin-top:12px;font-size:12.5px;padding:8px 10px;border-radius:8px; }
  .authmsg.error{background:#F6E3E1;color:var(--error);}
  .authmsg.info{background:var(--accent-soft);color:var(--accent);}

  .topbar{
    position:sticky;top:0;z-index:10;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
    padding:10px 16px 8px;
  }
  .nav{ display:flex;align-items:center;justify-content:space-between; max-width:640px;margin:0 auto; }
  .nav button{
    background:none;border:none;font-size:22px;color:var(--ink);
    padding:6px 10px;cursor:pointer;border-radius:8px;
  }
  .nav button:active{background:var(--rule);}
  .nav button:disabled{opacity:0.25;cursor:default;}
  .navlabel{
    font-size:12px;letter-spacing:0.08em;color:var(--ink-soft);
    text-transform:uppercase;font-weight:600;
  }
  .signout{
    font-size:11px;color:var(--ink-soft);background:none;border:none;
    cursor:pointer;text-decoration:underline;padding:4px;
  }
  .status{
    text-align:center;font-size:11px;color:var(--ink-soft);
    letter-spacing:0.04em;padding-top:2px;min-height:14px;
  }
  .status.error{color:var(--error);font-weight:600;}
  main{max-width:640px;margin:0 auto;padding:18px 16px 40px;}

  .datehead{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-weight:700;font-size:26px;line-height:1.2;
    margin:6px 0 6px;
  }
  .quicknote{
    width:100%;border:none;background:transparent;
    font-family:Georgia,serif;font-style:italic;font-size:16px;
    color:var(--ink-soft);border-bottom:1px solid var(--rule);
    padding:6px 2px 10px;resize:none;
  }
  .quicknote:focus{outline:none;border-bottom-color:var(--accent);}

  .locked-banner{
    margin-top:14px;background:var(--accent-soft);color:var(--accent);
    font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:8px;
  }

  .timeline{ position:relative;margin-top:18px;padding-left:22px; }
  .timeline::before{
    content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;
    background:var(--rule);
  }
  .block{position:relative;margin-bottom:16px;}
  .block::before{
    content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;
    border-radius:50%;background:var(--gold);border:2px solid var(--paper);
  }
  .block-card{
    background:var(--paper-card);border:1px solid var(--rule);
    border-radius:10px;padding:12px 14px;
  }
  .block-label{
    font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
    font-weight:700;color:var(--gold);margin-bottom:6px;
  }
  .block-hours{
    font-size:10.5px;color:var(--ink-soft);font-weight:400;
    letter-spacing:0.02em;margin-left:6px;text-transform:none;
  }
  textarea.block-text{
    width:100%;border:none;background:transparent;resize:vertical;
    min-height:44px;font-size:15px;line-height:1.45;color:var(--ink);
    font-family:inherit;padding:0;
  }
  textarea.block-text:focus{outline:none;}
  textarea.block-text:disabled{color:var(--locked);}

  .tasks-preview{
    margin-top:22px;padding:12px 14px;border:1px dashed var(--rule);
    border-radius:10px;background:var(--paper-card);
  }
  .tasks-preview h3{
    margin:0 0 8px;font-size:12px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--ink-soft);font-weight:700;
  }
  .tasks-preview ul{margin:0;padding-left:18px;font-size:14px;}
  .tasks-preview li{margin-bottom:4px;}
  .tasks-preview .empty{font-size:13px;color:var(--ink-soft);font-style:italic;}
  .tasks-preview .note{ margin-top:8px;font-size:11px;color:var(--ink-soft); }
</style>
</head>
<body>

<div id="authScreen">
  <div class="authbox">
    <h1>Journal</h1>
    <p class="sub" id="authSub">Connecte-toi pour accéder à ton journal.</p>
    <label for="authEmail">Courriel</label>
    <input type="email" id="authEmail" autocomplete="email">
    <label for="authPassword">Mot de passe</label>
    <input type="password" id="authPassword" autocomplete="current-password">
    <button class="primary" id="authSubmit">Se connecter</button>
    <div class="switchmode">
      <span id="switchText">Pas encore de compte ?</span>
      <button id="switchBtn">Créer un compte</button>
    </div>
    <div id="authMsg"></div>
  </div>
</div>

<div id="appRoot" style="display:none;">
  <div class="topbar">
    <div class="nav">
      <button id="prevBtn" aria-label="Jour précédent">‹</button>
      <div style="text-align:center;">
        <div class="navlabel" id="navLabel">Aujourd'hui</div>
      </div>
      <button id="nextBtn" aria-label="Jour suivant">›</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto;">
      <div class="status" id="statusLine">&nbsp;</div>
      <button class="signout" id="signoutBtn">Se déconnecter</button>
    </div>
  </div>

  <main>
    <div class="datehead" id="dateHead"></div>
    <textarea class="quicknote" id="quicknote" rows="1" placeholder="Une ligne pour aujourd'hui…"></textarea>

    <div id="lockedBanner" class="locked-banner" style="display:none;">
      Journée archivée — lecture seule.
    </div>

    <div class="timeline" id="timeline"></div>

    <div class="tasks-preview">
      <h3>Tâches détectées (/T … /tt)</h3>
      <ul id="taskList"></ul>
      <div class="empty" id="taskEmpty">Aucune pour l'instant.</div>
      <div class="note">Aperçu seulement — l'onglet Tâches n'existe pas encore, rien n'est créé pour de vrai.</div>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = "https://oganxzybmbapacijjcie.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ja0QHYTDJqK0euwvfFkoXw_RQUuIfvV";
const SESSION_KEY = "supabase-session";

const SECTIONS = [
  {key:"reveil", label:"Réveil"},
  {key:"matin",  label:"Matin"},
  {key:"am",     label:"Am", hours:"6 h – 11 h 59"},
  {key:"diner",  label:"Dîner"},
  {key:"pm",     label:"Pm", hours:"12 h – 16 h 59"},
  {key:"souper", label:"Souper"},
  {key:"soiree", label:"Soirée", hours:"17 h – 21 h 59"},
];

const DAY_NAMES = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MONTH_NAMES = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

let offset = 0;
let saveTimer = null;
let currentRowId = null;
let session = null;
let authMode = "login";

function decodeJwt(token){
  try{
    const payload = token.split('.')[1];
    const json = atob(payload.replace(/-/g,'+').replace(/_/g,'/'));
    return JSON.parse(json);
  }catch(e){ return null; }
}

async function saveSession(s){
  session = s;
  try{ await window.storage.set(SESSION_KEY, JSON.stringify(s), false); }
  catch(e){ console.error('Impossible de sauvegarder la session', e); }
}
async function clearSession(){
  session = null;
  try{ await window.storage.delete(SESSION_KEY, false); }catch(e){}
}
async function loadStoredSession(){
  try{
    const r = await window.storage.get(SESSION_KEY, false);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){}
  return null;
}

async function refreshSession(refresh_token){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method:"POST",
    headers:{ "apikey": SUPABASE_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ refresh_token })
  });
  if(!res.ok) throw new Error("refresh failed");
  const data = await res.json();
  const s = { access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now() + (data.expires_in*1000) };
  await saveSession(s);
  return s;
}

async function ensureValidSession(){
  if(!session) return false;
  if(session.expires_at - Date.now() > 60000) return true;
  try{ await refreshSession(session.refresh_token); return true; }
  catch(e){ await clearSession(); return false; }
}

function setAuthMsg(text, kind){
  const el = document.getElementById('authMsg');
  el.textContent = text || '';
  el.className = 'authmsg' + (kind ? ' ' + kind : '');
}

async function doSignIn(email, password){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method:"POST",
    headers:{ "apikey": SUPABASE_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || "Connexion refusée");
  await saveSession({ access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now() + (data.expires_in*1000) });
}

async function doSignUp(email, password){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method:"POST",
    headers:{ "apikey": SUPABASE_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || "Création du compte refusée");
  if(data.access_token){
    await saveSession({ access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now() + (data.expires_in*1000) });
    return true;
  }
  return false;
}

function updateAuthModeUI(){
  document.getElementById('authSubmit').textContent = authMode === 'login' ? 'Se connecter' : 'Créer le compte';
  document.getElementById('authSub').textContent = authMode === 'login'
    ? "Connecte-toi pour accéder à ton journal."
    : "Crée ton compte personnel.";
  document.getElementById('switchText').textContent = authMode === 'login' ? "Pas encore de compte ?" : "Déjà un compte ?";
  document.getElementById('switchBtn').textContent = authMode === 'login' ? "Créer un compte" : "Se connecter";
}

document.getElementById('switchBtn').addEventListener('click', () => {
  authMode = authMode === 'login' ? 'signup' : 'login';
  setAuthMsg('');
  updateAuthModeUI();
});

document.getElementById('authSubmit').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ setAuthMsg("Entre un courriel et un mot de passe.", "error"); return; }
  const btn = document.getElementById('authSubmit');
  btn.disabled = true;
  setAuthMsg('');
  try{
    if(authMode === 'login'){
      await doSignIn(email, password);
      enterApp();
    } else {
      const loggedIn = await doSignUp(email, password);
      if(loggedIn){
        enterApp();
      } else {
        setAuthMsg("Compte créé. Confirme ton adresse courriel, puis reviens te connecter.", "info");
        authMode = 'login';
        updateAuthModeUI();
      }
    }
  }catch(err){
    setAuthMsg(err.message, "error");
  }finally{
    btn.disabled = false;
  }
});

function enterApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  loadDay();
}

document.getElementById('signoutBtn').addEventListener('click', async () => {
  await clearSession();
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
});

async function apiFetch(path, options={}){
  const ok = await ensureValidSession();
  if(!ok) throw new Error("session expirée");
  const headers = Object.assign({
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + session.access_token,
    "Content-Type": "application/json"
  }, options.headers || {});
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, Object.assign({}, options, {headers}));
  if(!res.ok){
    const txt = await res.text();
    throw new Error("Erreur Supabase: " + txt);
  }
  return res;
}

function dateForOffset(off){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + off);
  return d;
}
function isoKey(d){ return d.toISOString().slice(0,10); }

function formatHeading(d){
  const dayName = DAY_NAMES[d.getDay()];
  const day = d.getDate();
  const month = MONTH_NAMES[d.getMonth()];
  const year = d.getFullYear();
  const capDay = dayName.charAt(0).toUpperCase() + dayName.slice(1);
  return `${capDay} le ${day} ${month} ${year}`;
}

function setStatus(text, isError){
  const el = document.getElementById('statusLine');
  el.textContent = text || '\u00A0';
  el.className = 'status' + (isError ? ' error' : '');
}

function buildTimeline(locked){
  const container = document.getElementById('timeline');
  container.innerHTML = '';
  SECTIONS.forEach(sec => {
    const block = document.createElement('div');
    block.className = 'block';
    const card = document.createElement('div');
    card.className = 'block-card';
    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = sec.label;
    if(sec.hours){
      const span = document.createElement('span');
      span.className = 'block-hours';
      span.textContent = sec.hours;
      label.appendChild(span);
    }
    const ta = document.createElement('textarea');
    ta.className = 'block-text';
    ta.id = 'field-' + sec.key;
    ta.rows = 2;
    ta.disabled = locked;
    ta.placeholder = locked ? '' : '…';
    ta.addEventListener('input', onFieldInput);
    card.appendChild(label);
    card.appendChild(ta);
    block.appendChild(card);
    container.appendChild(block);
  });
}

function onFieldInput(){ scheduleSave(); refreshTaskPreview(); }

function scheduleSave(){
  setStatus('Modification…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCurrent, 700);
}

function collectData(){
  const data = { quicknote: document.getElementById('quicknote').value };
  SECTIONS.forEach(sec => {
    const el = document.getElementById('field-' + sec.key);
    data[sec.key] = el ? el.value : '';
  });
  return data;
}

function refreshTaskPreview(){
  const data = collectData();
  const allText = [data.quicknote, ...SECTIONS.map(s => data[s.key])].join('\n');
  const re = /\/T([\s\S]*?)\/tt/gi;
  const found = [];
  let m;
  while((m = re.exec(allText)) !== null){
    const t = m[1].trim();
    if(t) found.push(t);
  }
  const list = document.getElementById('taskList');
  const empty = document.getElementById('taskEmpty');
  list.innerHTML = '';
  if(found.length === 0){
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    found.forEach(t => {
      const li = document.createElement('li');
      li.textContent = t;
      list.appendChild(li);
    });
  }
}

async function saveCurrent(){
  const d = dateForOffset(offset);
  const entry_date = isoKey(d);
  const data = collectData();
  try{
    if(currentRowId){
      await apiFetch(`journal_entries?id=eq.${currentRowId}`, {
        method: "PATCH",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify(Object.assign({}, data, { updated_at: new Date().toISOString() }))
      });
    } else {
      const res = await apiFetch(`journal_entries`, {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify(Object.assign({}, data, { entry_date }))
      });
      const rows = await res.json();
      if(rows && rows[0]) currentRowId = rows[0].id;
    }
    setStatus('Enregistré');
    setTimeout(() => setStatus(''), 1200);
  }catch(err){
    console.error('Erreur de sauvegarde', err);
    setStatus('Échec de la sauvegarde — vérifie ta connexion', true);
  }
}

async function loadDay(){
  const d = dateForOffset(offset);
  const locked = offset <= -3;

  document.getElementById('dateHead').textContent = formatHeading(d);
  document.getElementById('navLabel').textContent =
    offset === 0 ? "Aujourd'hui" :
    offset === -1 ? "Hier" :
    offset === -2 ? "Avant-hier" :
    "Archivé";
  document.getElementById('lockedBanner').style.display = locked ? 'block' : 'none';
  document.getElementById('nextBtn').disabled = offset >= 0;

  buildTimeline(locked);
  document.getElementById('quicknote').disabled = locked;

  setStatus('Chargement…');
  const entry_date = isoKey(d);
  let data = { quicknote:'', reveil:'', matin:'', am:'', diner:'', pm:'', souper:'', soiree:'' };
  currentRowId = null;
  try{
    const res = await apiFetch(`journal_entries?entry_date=eq.${entry_date}&select=*`);
    const rows = await res.json();
    if(rows && rows[0]){
      data = Object.assign(data, rows[0]);
      currentRowId = rows[0].id;
    }
    setStatus('');
  }catch(err){
    console.error(err);
    setStatus('Impossible de charger — vérifie ta connexion', true);
  }

  document.getElementById('quicknote').value = data.quicknote || '';
  SECTIONS.forEach(sec => {
    const el = document.getElementById('field-' + sec.key);
    if(el) el.value = data[sec.key] || '';
  });
  refreshTaskPreview();
}

document.getElementById('prevBtn').addEventListener('click', () => { offset -= 1; loadDay(); });
document.getElementById('nextBtn').addEventListener('click', () => { if(offset < 0){ offset += 1; loadDay(); } });
document.getElementById('quicknote').addEventListener('input', onFieldInput);

(async function init(){
  const stored = await loadStoredSession();
  if(stored){
    session = stored;
    const ok = await ensureValidSession();
    if(ok){ enterApp(); return; }
  }
  updateAuthModeUI();
})();
</script>
</body>
</html>
